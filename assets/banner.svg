<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .stat-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Dynamic / Animated Flowing Ambient Elements (Behind foreground content) -->
  <g opacity="0.65">
    <!-- Animated Glowing Wave 1 -->
    <path fill="none" stroke="url(#primary-glow)" stroke-width="2.5" opacity="0.4"
      d="M -100 280 Q 200 220 500 290 T 1100 270 T 1300 290">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M -100 280 Q 200 220 500 290 T 1100 270 T 1300 290;
                M -100 290 Q 250 330 550 250 T 1100 300 T 1300 270;
                M -100 280 Q 200 220 500 290 T 1100 270 T 1300 290" />
    </path>

    <!-- Animated Glowing Wave 2 -->
    <path fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.3"
      d="M -100 310 Q 300 340 700 280 T 1300 310">
      <animate attributeName="d" dur="16s" repeatCount="indefinite"
        values="M -100 310 Q 300 340 700 280 T 1300 310;
                M -100 270 Q 350 260 750 320 T 1300 280;
                M -100 310 Q 300 340 700 280 T 1300 310" />
    </path>

    <!-- Floating Orbs in Background -->
    <circle cx="1060" cy="80" r="120" fill="#0284c7" filter="url(#glow-filter)" opacity="0.12">
      <animate attributeName="cy" values="80;100;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="280" r="90" fill="#059669" filter="url(#glow-filter)" opacity="0.1">
      <animate attributeName="cy" values="280;260;280" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Data Pulses along Network Lines -->
    <line x1="880" y1="120" x2="1080" y2="120" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="980" y1="120" x2="980" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="880" y1="240" x2="1080" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="980" cy="120" r="5" fill="#38bdf8">
      <animate attributeName="cx" values="880;1080;880" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="180" r="4" fill="#34d399">
      <animate attributeName="cy" values="120;240;120" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="5" fill="#818cf8">
      <animate attributeName="cx" values="1080;880;1080" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Graphic Element: Security Trust Shield -->
  <g transform="translate(940, 100)">
    <polygon points="50,10 90,25 90,75 50,110 10,75 10,25" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <!-- Animated Checkmark / Lock Inside Shield -->
    <path d="M 33 58 L 45 70 L 68 45" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,100; 100,0; 100,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Orbiting Security Node -->
    <circle cx="50" cy="60" r="62" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 50 60" to="360 50 60" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content: Header Pill, Title, Subtitle, Feature Badges (Always in foreground, never obscured) -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Badge -->
    <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="16" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" class="stat-text">CURATED REPOSITORY &amp; DIRECTORY</text>
    <text x="260" y="20" class="stat-text" fill="#94a3b8">2026 EDITION</text>

    <!-- Title -->
    <text x="0" y="85" class="title-text">Awesome Security, Compliance</text>
    <text x="0" y="135" class="title-text" fill="url(#primary-glow)">&amp; Trust Center Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text">A comprehensive directory of SaaS leaders and open-source software for continuous compliance,</text>
    <text x="0" y="200" class="subtitle-text">public trust portals, automated security questionnaires, and audit-ready evidence management.</text>

    <!-- Key Category Interactive/Feature Cards -->
    <g transform="translate(0, 230)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
        <text x="36" y="26" class="tag-text">Trust Centers</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(195, 0)">
        <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="22" cy="21" r="5" fill="#10b981"/>
        <text x="36" y="26" class="tag-text">Compliance Automation</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(420, 0)">
        <rect width="215" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="22" cy="21" r="5" fill="#a855f7"/>
        <text x="36" y="26" class="tag-text">Questionnaire AI (SIG/CAIQ)</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(650, 0)">
        <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <circle cx="22" cy="21" r="5" fill="#f59e0b"/>
        <text x="36" y="26" class="tag-text">Open Source GRC</text>
      </g>
    </g>
  </g>
</svg>
